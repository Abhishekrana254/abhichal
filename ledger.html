<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#09090b" />
  <title>Ledger · Formatly</title>
  <link rel="stylesheet" href="style.css?v=11" />
  <style>
    .box { max-width: 520px; padding: 40px 0; }
    label { display: block; font-size: 13px; color: #9b9ba6; margin-top: 14px; }
    input { width: 100%; margin-top: 6px; padding: 13px; border-radius: 12px; border: 1px solid #26262d; background: #111114; color: #f5f5f4; font-size: 16px; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #26262d; font-variant-numeric: tabular-nums; }
    .good { color: #d7ff3f; } .bad { color: #ff7a45; }
  </style>
</head>
<body>
  <header class="nav"><div class="wrap"><a class="logo" href="./"><i></i>Formatly</a></div></header>
  <main class="wrap box">
    <h2>Ledger</h2>
    <p class="sub">Your own page. Type today's ad spend, visits, and ₹149 purchases from the Razorpay dashboard. Scale only if payback stays at 100% or more. Saved in this browser only.</p>
    <label>Ad spend today ₹ <input id="spend" inputmode="numeric" placeholder="100" /></label>
    <label>Visits <input id="visits" inputmode="numeric" placeholder="0" /></label>
    <label>Purchases <input id="buys" inputmode="numeric" placeholder="0" /></label>
    <p><button class="btn" id="save" type="button">Save today</button></p>
    <div id="result"></div>
    <div id="log"></div>
  </main>
  <script>
    const LOG = "abhichal-hisab";
    const rows = () => { try { return JSON.parse(localStorage.getItem(LOG) || "[]"); } catch { return []; } };
    const back = (r) => (r.spend ? Math.round((r.buys * 149 / r.spend) * 100) : 0);
    function paint() {
      document.getElementById("log").innerHTML = rows().map((r) => {
        const b = back(r);
        return `<div class="row"><span>${r.day}</span><span class="${b >= 100 ? "good" : "bad"}">${b}% · ₹${r.buys * 149} / ₹${r.spend}</span></div>`;
      }).join("");
    }
    document.getElementById("save").onclick = () => {
      const spend = Number(document.getElementById("spend").value || 0);
      const visits = Number(document.getElementById("visits").value || 0);
      const buys = Number(document.getElementById("buys").value || 0);
      const day = new Date().toLocaleDateString("en-IN");
      const list = rows().filter((r) => r.day !== day);
      list.unshift({ day, spend, visits, buys });
      localStorage.setItem(LOG, JSON.stringify(list.slice(0, 30)));
      const b = spend ? Math.round((buys * 149 / spend) * 100) : 0;
      document.getElementById("result").innerHTML = `<p class="${b >= 100 ? "good" : "bad"}">${b >= 100 ? b + "% back. Keep the budget, or raise it a little." : b + "% back. Under 100%. Do not raise the budget."}</p>`;
      paint();
    };
    paint();
  </script>
</body>
</html>
